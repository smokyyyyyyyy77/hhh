<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>合规报告门户 · 按钮样式配置器</title>
<style>
:root{--blue:#00338d;--dark:#00205b;--bg:#f3f5f9;--card:#fff;--line:#e5e7eb;--muted:#667085;--ink:#172033}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{background:var(--dark);color:#fff;padding:18px 28px}header h1{margin:0;font-size:20px}header p{margin:4px 0 0;opacity:.78}
main{max-width:1180px;margin:0 auto;padding:22px 20px 48px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:18px}@media(max-width:900px){.layout{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 3px 14px #0f1e3c0b;margin-bottom:16px}.card h2{font-size:16px;margin:0 0 14px}.card h3{font-size:14px;margin:0 0 10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:600px){.two{grid-template-columns:1fr}}
.group{border:1px solid var(--line);border-radius:11px;padding:14px}.group.ag{border-top:4px solid #0e7a3d}.group.de{border-top:4px solid #6b7280}.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.field input,.field select{width:100%;border:1px solid #d5d9e2;border-radius:7px;padding:7px 8px;font:inherit;background:#fff}.field input[type=color]{height:35px;padding:2px;cursor:pointer}.color-pair{display:grid;grid-template-columns:56px 1fr;gap:8px;align-items:center}.field.full{grid-column:1/-1}
.preview{background:#e8ebf0;border-radius:10px;padding:18px;min-height:470px;display:flex;align-items:center;justify-content:center}.page{position:relative;width:min(100%,350px);aspect-ratio:595/842;background:white;box-shadow:0 8px 24px #0f1e3c2b;padding:38px 30px;color:#111827}.fake-line{height:7px;background:#e5e7eb;border-radius:5px;margin:0 0 13px}.fake-line.w80{width:80%}.fake-line.w92{width:92%}.fake-line.w65{width:65%}.fake-title{font-weight:700;font-size:15px;margin:18px 0}.button-area{position:absolute;left:0;right:0;bottom:36px;display:flex;justify-content:center;gap:8px}.demo-btn{display:flex;align-items:center;justify-content:center;white-space:nowrap;font-weight:700;font-family:Arial,"Microsoft YaHei",sans-serif;overflow:hidden}.json{width:100%;min-height:240px;resize:vertical;border:1px solid #d5d9e2;border-radius:8px;padding:10px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:#fafbfc}.actions{display:flex;flex-wrap:wrap;gap:9px}.btn{border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#eef2ff;color:#243b80}.plain{background:#fff;border:1px solid var(--line);color:var(--ink)}.hint{color:var(--muted);font-size:12px}.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#172033;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
</style>
</head>
<body>
<header><h1>合规报告门户 · 按钮样式配置器</h1><p>不用描述样式，直接调整参数和预览；完成后导出 JSON 发给我。</p></header>
<main>
<div class="layout"><section>
<div class="card"><h2>1. 设置按钮样式</h2><div class="two">
<div class="group ag"><h3>I Agree</h3><div class="fields">
<div class="field full"><label>按钮文字</label><input id="ag-text" value="I Agree"></div>
<div class="field"><label>字号（pt）</label><input id="ag-fs" type="number" min="4" max="40" value="14"></div><div class="field"><label>宽度（pt）</label><input id="ag-w" type="number" min="20" max="300" value="130"></div>
<div class="field"><label>高度（pt）</label><input id="ag-h" type="number" min="12" max="100" value="36"></div><div class="field"><label>边框宽（pt）</label><input id="ag-bw" type="number" min="0" max="6" value="1"></div>
<div class="field"><label>背景色</label><div class="color-pair"><input id="ag-bg" type="color" value="#0e7a3d"><input id="ag-bg-text" value="#0e7a3d" placeholder="#RRGGBB 或 14,122,61"></div></div><div class="field"><label>背景透明度（0-100）</label><input id="ag-bg-alpha" type="number" min="0" max="100" value="100"></div>
<div class="field"><label>文字色</label><div class="color-pair"><input id="ag-fg" type="color" value="#ffffff"><input id="ag-fg-text" value="#ffffff" placeholder="#RRGGBB 或 255,255,255"></div></div><div class="field"><label>文字透明度（0-100）</label><input id="ag-fg-alpha" type="number" min="0" max="100" value="100"></div>
<div class="field"><label>边框色</label><div class="color-pair"><input id="ag-bd" type="color" value="#0e7a3d"><input id="ag-bd-text" value="#0e7a3d" placeholder="#RRGGBB 或 14,122,61"></div></div><div class="field"><label>边框透明度（0-100）</label><input id="ag-bd-alpha" type="number" min="0" max="100" value="100"></div>
<div class="field full"><label>阴影颜色</label><div class="color-pair"><input id="ag-shadow-color" type="color" value="#000000"><input id="ag-shadow-color-text" value="#000000" placeholder="#RRGGBB 或 0,0,0"></div></div>
<div class="field"><label>阴影透明度（0-100）</label><input id="ag-shadow-alpha" type="number" min="0" max="100" value="28"></div><div class="field"><label>阴影水平偏移（pt）</label><input id="ag-shadow-x" type="number" min="-30" max="30" value="0"></div>
<div class="field"><label>阴影垂直偏移（pt）</label><input id="ag-shadow-y" type="number" min="-30" max="30" value="4"></div><div class="field"><label>阴影模糊（pt）</label><input id="ag-shadow-blur" type="number" min="0" max="40" value="8"></div>
<div class="field"><label>阴影扩散（pt）</label><input id="ag-shadow-spread" type="number" min="-20" max="20" value="0"></div>
</div></div>
<div class="group de"><h3>Decline</h3><div class="fields">
<div class="field full"><label>按钮文字</label><input id="de-text" value="Decline"></div>
<div class="field"><label>字号（pt）</label><input id="de-fs" type="number" min="4" max="40" value="14"></div><div class="field"><label>宽度（pt）</label><input id="de-w" type="number" min="20" max="300" value="130"></div>
<div class="field"><label>高度（pt）</label><input id="de-h" type="number" min="12" max="100" value="36"></div><div class="field"><label>边框宽（pt）</label><input id="de-bw" type="number" min="0" max="6" value="1"></div>
<div class="field"><label>背景色</label><div class="color-pair"><input id="de-bg" type="color" value="#9ca3af"><input id="de-bg-text" value="#9ca3af" placeholder="#RRGGBB 或 156,163,175"></div></div><div class="field"><label>背景透明度（0-100）</label><input id="de-bg-alpha" type="number" min="0" max="100" value="100"></div>
<div class="field"><label>文字色</label><div class="color-pair"><input id="de-fg" type="color" value="#ffffff"><input id="de-fg-text" value="#ffffff" placeholder="#RRGGBB 或 255,255,255"></div></div><div class="field"><label>文字透明度（0-100）</label><input id="de-fg-alpha" type="number" min="0" max="100" value="100"></div>
<div class="field"><label>边框色</label><div class="color-pair"><input id="de-bd" type="color" value="#6b7280"><input id="de-bd-text" value="#6b7280" placeholder="#RRGGBB 或 107,114,128"></div></div><div class="field"><label>边框透明度（0-100）</label><input id="de-bd-alpha" type="number" min="0" max="100" value="100"></div>
<div class="field full"><label>阴影颜色</label><div class="color-pair"><input id="de-shadow-color" type="color" value="#000000"><input id="de-shadow-color-text" value="#000000" placeholder="#RRGGBB 或 0,0,0"></div></div>
<div class="field"><label>阴影透明度（0-100）</label><input id="de-shadow-alpha" type="number" min="0" max="100" value="18"></div><div class="field"><label>阴影水平偏移（pt）</label><input id="de-shadow-x" type="number" min="-30" max="30" value="0"></div>
<div class="field"><label>阴影垂直偏移（pt）</label><input id="de-shadow-y" type="number" min="-30" max="30" value="4"></div><div class="field"><label>阴影模糊（pt）</label><input id="de-shadow-blur" type="number" min="0" max="40" value="8"></div>
<div class="field"><label>阴影扩散（pt）</label><input id="de-shadow-spread" type="number" min="-20" max="20" value="0"></div>
</div></div>
</div></div>
<div class="card"><h2>2. 设置按钮位置</h2><div class="two"><div class="field"><label>位置模式</label><select id="pos"><option value="auto">自动：内容底部居中</option><option value="manual">手动：第 1 页自定义 X/Y</option></select></div><div class="hint" style="align-self:end">手动坐标单位为 pt，页面尺寸按 A4：595 × 842 pt。</div></div><div class="two" id="coords" style="margin-top:12px"><div class="group"><h3>I Agree 坐标</h3><div class="fields"><div class="field"><label>X（距左）</label><input id="ag-x" type="number" min="0" max="595" value="180"></div><div class="field"><label>Y（距上）</label><input id="ag-y" type="number" min="0" max="842" value="700"></div></div></div><div class="group"><h3>Decline 坐标</h3><div class="fields"><div class="field"><label>X（距左）</label><input id="de-x" type="number" min="0" max="595" value="320"></div><div class="field"><label>Y（距上）</label><input id="de-y" type="number" min="0" max="842" value="700"></div></div></div></div></div>
<div class="card"><h2>3. 导出配置</h2><div class="actions"><button class="btn primary" id="download">下载 JSON 文件</button><button class="btn secondary" id="copy">复制 JSON</button><button class="btn plain" id="reset">恢复默认</button><label class="btn plain" for="load">导入 JSON<input id="load" type="file" accept=".json,application/json" hidden></label></div><p class="hint">颜色既可以直接点选，也可以输入 `#RRGGBB` 或 `R,G,B`；透明度输入 0-100。下载或复制后，把 JSON 内容发给我。我会据此把按钮设置固定到正式软件中。</p></div>
</section><aside>
<div class="card"><h2>实时预览</h2><div class="preview"><div class="page"><div class="fake-title">合规报告访问门户</div><div class="fake-line w92"></div><div class="fake-line w80"></div><div class="fake-line w65"></div><div class="fake-title">用户许可协议</div><div class="fake-line w92"></div><div class="fake-line w92"></div><div class="fake-line w80"></div><div class="button-area" id="button-area"><div class="demo-btn" id="ag-demo"></div><div class="demo-btn" id="de-demo"></div></div></div></div></div>
<div class="card"><h2>当前 JSON</h2><textarea class="json" id="output" readonly></textarea></div>
</aside></div></main><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const ids=['ag-text','ag-fs','ag-w','ag-h','ag-bg','ag-bg-text','ag-bg-alpha','ag-fg','ag-fg-text','ag-fg-alpha','ag-bd','ag-bd-text','ag-bd-alpha','ag-bw','ag-shadow-color','ag-shadow-color-text','ag-shadow-alpha','ag-shadow-x','ag-shadow-y','ag-shadow-blur','ag-shadow-spread','de-text','de-fs','de-w','de-h','de-bg','de-bg-text','de-bg-alpha','de-fg','de-fg-text','de-fg-alpha','de-bd','de-bd-text','de-bd-alpha','de-bw','de-shadow-color','de-shadow-color-text','de-shadow-alpha','de-shadow-x','de-shadow-y','de-shadow-blur','de-shadow-spread','ag-x','ag-y','de-x','de-y','pos'];
const colorPairs=[['ag-bg','ag-bg-text'],['ag-fg','ag-fg-text'],['ag-bd','ag-bd-text'],['ag-shadow-color','ag-shadow-color-text'],['de-bg','de-bg-text'],['de-fg','de-fg-text'],['de-bd','de-bd-text'],['de-shadow-color','de-shadow-color-text']];
const num=id=>Math.max(0,Number($(id).value)||0);
const clampAlpha=id=>Math.min(100,Math.max(0,Number($(id).value)||0));
function rgbToHex(text){const m=String(text).trim().match(/^(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})$/);if(!m)return null;const vals=m.slice(1).map(Number);if(vals.some(v=>v<0||v>255))return null;return '#'+vals.map(v=>v.toString(16).padStart(2,'0')).join('')}
function normalizeColor(text){const raw=String(text).trim();if(/^#([0-9a-fA-F]{6})$/.test(raw))return raw.toLowerCase();const rgb=rgbToHex(raw);return rgb?rgb.toLowerCase():null}
function hexToRgba(hex, alpha){const normalized=normalizeColor(hex)||'#000000';const n=parseInt(normalized.slice(1),16);const r=(n>>16)&255,g=(n>>8)&255,b=n&255;return `rgba(${r}, ${g}, ${b}, ${(Math.min(100,Math.max(0,alpha))/100).toFixed(2)})`}
function syncColorInputs(){for(const [picker,text] of colorPairs){const p=$(picker),t=$(text);if(document.activeElement===t){const normalized=normalizeColor(t.value);if(normalized){p.value=normalized;t.value=normalized}}else{t.value=p.value.toLowerCase()}}}
function style(prefix){return {text:$(prefix+'-text').value||prefix,fs:num(prefix+'-fs')||14,w:num(prefix+'-w')||130,h:num(prefix+'-h')||36,bg:$(prefix+'-bg').value,bgAlpha:clampAlpha(prefix+'-bg-alpha'),fg:$(prefix+'-fg').value,fgAlpha:clampAlpha(prefix+'-fg-alpha'),bd:$(prefix+'-bd').value,bdAlpha:clampAlpha(prefix+'-bd-alpha'),bw:num(prefix+'-bw'),shadow:{color:$(prefix+'-shadow-color').value,alpha:clampAlpha(prefix+'-shadow-alpha'),x:num(prefix+'-shadow-x'),y:num(prefix+'-shadow-y'),blur:num(prefix+'-shadow-blur'),spread:Number($(prefix+'-shadow-spread').value)||0}}}
function config(){const manual=$('pos').value==='manual';return {version:1,page:{width:595,height:842},position:manual?'manual':'auto',agree:{...style('ag'),...(manual?{x:num('ag-x'),yTop:num('ag-y')}:{})},decline:{...style('de'),...(manual?{x:num('de-x'),yTop:num('de-y')}:{})}}}
function render(){syncColorInputs();const c=config();const a=c.agree,d=c.decline;for(const [id,b] of [['ag-demo',a],['de-demo',d]]){const el=$(id);el.textContent=b.text;el.style.width=b.w/1.7+'px';el.style.height=b.h/1.7+'px';el.style.background=hexToRgba(b.bg,b.bgAlpha);el.style.color=hexToRgba(b.fg,b.fgAlpha);el.style.border=b.bw+'px solid '+hexToRgba(b.bd,b.bdAlpha);el.style.fontSize=b.fs/1.7+'px';el.style.boxShadow=b.shadow?`${b.shadow.x/1.7}px ${b.shadow.y/1.7}px ${b.shadow.blur/1.7}px ${b.shadow.spread/1.7}px ${hexToRgba(b.shadow.color,b.shadow.alpha)}`:'none';if(c.position==='manual'){el.style.position='absolute';el.style.left=b.x/1.7+'px';el.style.top=b.yTop/1.7+'px'}else{el.style.position='static';el.style.left='';el.style.top=''}}$('button-area').style.position=c.position==='manual'?'static':'absolute';$('button-area').style.justifyContent=c.position==='manual'?'initial':'center';$('output').value=JSON.stringify(c,null,2);$('coords').style.display=c.position==='manual'?'grid':'none'}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.remove('show'),2200)}
ids.forEach(id=>$(id).addEventListener('input',render));
$('download').onclick=()=>{const blob=new Blob([$('output').value],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='按钮样式配置.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('JSON 已下载')};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('output').value);toast('JSON 已复制')}catch(e){$('output').select();document.execCommand('copy');toast('JSON 已复制')}};
$('reset').onclick=()=>{location.reload()};
$('load').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const c=JSON.parse(r.result);const map=[['ag','agree'],['de','decline']];map.forEach(([x,p])=>{const b=c[p]||{};Object.entries({text:'text',fs:'fs',w:'w',h:'h',bg:'bg',bgAlpha:'bgAlpha',fg:'fg',fgAlpha:'fgAlpha',bd:'bd',bdAlpha:'bdAlpha',bw:'bw',x:'x',y:'yTop'}).forEach(([field,key])=>{if(b[key]!==undefined&&$(x+'-'+field))$(x+'-'+field).value=b[key]});if(b.shadow){Object.entries({'shadow-color':'color','shadow-alpha':'alpha','shadow-x':'x','shadow-y':'y','shadow-blur':'blur','shadow-spread':'spread'}).forEach(([field,key])=>{if(b.shadow[key]!==undefined&&$(x+'-'+field))$(x+'-'+field).value=b.shadow[key]})}});if(c.position)$('pos').value=c.position;syncColorInputs();render();toast('JSON 已导入')}catch(err){toast('JSON 格式无效')}};r.readAsText(f)};
syncColorInputs();render();
</script></body></html>
